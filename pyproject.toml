[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tea-clipper"
version = "0.2.0"
description = "Medal-style instant-replay game clipper for Linux/Wayland"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PyGObject>=3.46",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/dutchteaa/tea-clipper"
Repository = "https://github.com/dutchteaa/tea-clipper"

[project.optional-dependencies]
dev = ["pytest>=8.0", "PySide6>=6.6"]
gui = ["PySide6>=6.6"]

[project.scripts]
tea-clipper = "tea_clipper.ui.app:main"
tea-clipper-daemon = "tea_clipper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "engine: integration tests that run a real GStreamer pipeline (need gstreamer + ffmpeg)",
]
